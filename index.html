<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="description" content="musicTK — your personal offline music library.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>musicTK</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">music<span>TK</span></div>
        <div class="tagline">Your music. Your library.</div>
      </div>
      <button id="importBtn" class="primary-btn" type="button">＋ Import</button>
      <input id="fileInput" type="file" accept="audio/*" multiple hidden>
    </header>

    <section class="search-wrap">
      <input id="searchInput" class="search" type="search" placeholder="Search your library..." autocomplete="off">
    </section>

    <nav class="tabs" aria-label="Library views">
      <button class="tab active" data-view="all">All</button>
      <button class="tab" data-view="favorites">♥ Favorites</button>
    </nav>

    <section id="library" class="library"></section>

    <section id="emptyState" class="empty-state">
      <div class="empty-icon">♫</div>
      <h2>Your library is empty</h2>
      <p>Import music from your device to start building musicTK.</p>
      <button id="emptyImportBtn" class="primary-btn" type="button">Import music</button>
    </section>

    <section class="demo-section">
      <div class="section-title-row">
        <div>
          <h2>Built-in demos</h2>
          <p>Original generated audio — included for testing the player.</p>
        </div>
      </div>
      <div id="demoList" class="demo-list">
        <button class="demo-card" data-demo="morning"><span>▶</span><div><strong>Morning Drive</strong><small>musicTK Demo</small></div></button>
        <button class="demo-card" data-demo="midnight"><span>▶</span><div><strong>Midnight City</strong><small>musicTK Demo</small></div></button>
        <button class="demo-card" data-demo="sunrise"><span>▶</span><div><strong>Sunrise</strong><small>musicTK Demo</small></div></button>
      </div>
    </section>
  </main>

  <footer id="player" class="player">
    <div class="now-playing">
      <div id="playerIcon" class="player-icon">♫</div>
      <div class="track-meta">
        <strong id="playerTitle">Nothing playing</strong>
        <span id="playerArtist">musicTK</span>
      </div>
    </div>
    <div class="controls">
      <button id="prevBtn" class="icon-btn" aria-label="Previous">⏮</button>
      <button id="playBtn" class="play-btn" aria-label="Play">▶</button>
      <button id="nextBtn" class="icon-btn" aria-label="Next">⏭</button>
    </div>
    <div class="progress-wrap">
      <span id="currentTime">0:00</span>
      <input id="progress" type="range" min="0" max="100" value="0" aria-label="Track progress">
      <span id="duration">0:00</span>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <script src="app.js"></script>
</body>
</html>
